<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Fantasy Game Scene</title>
  <style>
    /* ========== עיצוב כללי ואיפוס ========== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #080c0e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #e0f2fe;
    }

    /* ========== רקע החדר (Dark Paneled Room) ========== */
    .room-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      /* דירוג צבעים עמוק בין כחול-אמרלד כהה לשרת עץ כהה */
      background: radial-gradient(circle at 50% 50%, #112229 0%, #080d10 70%, #030507 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.95);
    }

    /* עיטורי פאנלים על הקיר מאחור ליצירת עומק */
    .room-wall-panels {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 80px 120px;
      pointer-events: none;
    }

    /* ========== קנבס לחלקיקי אור (Glowing Embers) ========== */
    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* ========== כרטיס הדמות והאווירה (Character Card) ========== */
    .character-card {
      position: relative;
      z-index: 10;
      width: 380px;
      height: 520px;
      border-radius: 24px;
      background: rgba(10, 20, 26, 0.75);
      border: 1px solid rgba(20, 184, 166, 0.3);
      backdrop-filter: blur(12px);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(0, 229, 163, 0.15),
        inset 0 0 25px rgba(245, 158, 11, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .character-card:hover {
      transform: translateY(-8px);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.9),
        0 0 45px rgba(0, 229, 163, 0.3),
        inset 0 0 30px rgba(245, 158, 11, 0.25);
    }

    /* מסגרת התמונה עם אפקט תאורה היקפית (Rim Light) */
    .avatar-frame {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      /* הילה זוהרת כפולה: ירוק-טורקיז וכתום-זהב */
      box-shadow: 
        0 0 25px rgba(13, 148, 136, 0.5),
        inset 0 0 20px rgba(245, 158, 11, 0.4);
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: drop-shadow(0 0 10px rgba(0,229,163,0.3));
    }

    /* גביש / קריסטל זוהר על הכרטיס */
    .glowing-orb {
      position: absolute;
      bottom: 15px;
      right: 15px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffedd5 0%, #f59e0b 50%, #d97706 100%);
      box-shadow: 
        0 0 15px #f59e0b,
        0 0 30px #ff7800,
        0 0 45px #ff7800;
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); box-shadow: 0 0 15px #f59e0b, 0 0 25px #ff7800; }
      100% { transform: scale(1.15); box-shadow: 0 0 25px #f59e0b, 0 0 50px #ff7800, 0 0 75px #ff7800; }
    }

    /* טקסטים וממשק */
    .char-title {
      margin-top: 20px;
      font-size: 1.6rem;
      font-weight: 700;
      color: #5eead4;
      text-shadow: 0 0 12px rgba(94, 234, 212, 0.6);
      letter-spacing: 1px;
    }

    .char-subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* מד בריאות / קסם זוהר */
    .stat-bar-container {
      width: 100%;
      margin-top: 20px;
    }

    .stat-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .stat-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stat-bar-fill {
      height: 100%;
      width: 85%;
      background: linear-gradient(90deg, #0d9488, #2dd4bf, #f59e0b);
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.8);
      border-radius: 5px;
    }

    /* כפתור בסגנון פנטזיה */
    .fantasy-btn {
      margin-top: 22px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%);
      color: #ffffff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(20, 184, 166, 0.4);
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .fantasy-btn:hover {
      background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 100%);
      box-shadow: 0 6px 20px rgba(45, 212, 191, 0.6);
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <div class="room-container">
    <div class="room-wall-panels"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- כרטיס הדמות -->
    <div class="character-card">
      <div class="avatar-frame">
        <!-- תמונת הדמות מתוך התמונה שסיפקת -->
        <img src="image_eefe05.jpg" alt="דרקון קסום">
        <div class="glowing-orb"></div>
      </div>

      <div class="char-title">דרקון הברקת</div>
      <div class="char-subtitle">יצור פנטזיה נדיר • רמה 12</div>

      <div class="stat-bar-container">
        <div class="stat-label">
          <span>עוצמת קסם (Mana)</span>
          <span>85%</span>
        </div>
        <div class="stat-bar-bg">
          <div class="stat-bar-fill"></div>
        </div>
      </div>

      <button class="fantasy-btn">הפעל יכולת קסומה ✨</button>
    </div>
  </div>

  <script>
    /* ========== תסריט חלקיקי אור (Magical Embers Particle System) ========== */
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const numParticles = 65;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 100;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 1.2 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.7 + 0.3;
        // גווני זהב, כתום וטורקיז רכים
        this.color = Math.random() > 0.4 ? '#f59e0b' : (Math.random() > 0.5 ? '#ff7800' : '#2dd4bf');
      }

      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.opacity -= 0.002;

        if (this.y < -10 || this.opacity <= 0) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < numParticles; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
