<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק טריוויה - קוד מעוצב</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --correct-color: #22c55e;
            --wrong-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 800px;
            max-width: 95vw;
            height: 520px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* סרגל עליון */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .score-board {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
        }

        .timer-bar-bg {
            width: 160px;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            overflow: hidden;
        }

        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: var(--accent-color);
            transition: width 0.1s linear;
        }

        /* קנבס המשחק */
        canvas {
            flex: 1;
            background: #111827;
            display: block;
        }

        /* חלונית השאלה (Modal) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .question-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .question-card {
            transform: translateY(0);
        }

        .question-card h2 {
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: #fff;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .option-btn {
            background: #334155;
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .feedback-message {
            margin-top: 18px;
            font-weight: bold;
            min-height: 24px;
            font-size: 1rem;
        }

        .feedback-correct {
            color: var(--correct-color);
        }

        .feedback-wrong {
            color: var(--wrong-color);
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="score-board">ניקוד: <span id="score">0</span></div>
        <div class="timer-container">
            <span>שאלה הבאה: <span id="time-text">14</span> ש'</span>
            <div class="timer-bar-bg">
                <div class="timer-bar-fill" id="timer-bar"></div>
            </div>
        </div>
    </div>

    <!-- קנבס המשחק -->
    <canvas id="gameCanvas"></canvas>

    <!-- Overlay שקופץ כשיש שאלה -->
    <div class="modal-overlay" id="questionModal">
        <div class="question-card">
            <h2 id="questionText">טוען שאלה...</h2>
            <div class="options-grid" id="optionsContainer"></div>
            <div class="feedback-message" id="feedbackText"></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight - 60;
    }
    resizeCanvas();

    // משתני משחק
    let isPaused = false;
    let score = 0;
    const QUESTION_INTERVAL = 14; // 14 שניות בין שאלה לשאלה
    let timeRemaining = QUESTION_INTERVAL;
    let timerInterval = null;

    // אובייקט השחקן (דוגמה לאלמנט נע במשחק)
    const player = {
        x: 60,
        y: canvas.height / 2,
        radius: 16,
        speedX: 4,
        speedY: 3,
        color: '#6366f1'
    };

    // מאגר שאלות
    const questions = [
        {
            q: "מה היא בירת ישראל?",
            options: ["תל אביב", "ירושלים", "חיפה", "באר שבע"],
            correct: 1
        },
        {
            q: "כמה ימים יש בשנה מעוברת?",
            options: ["365", "366", "364", "360"],
            correct: 1
        },
        {
            q: "איזה כוכב לכת הוא הקרוב ביותר לשמש?",
            options: ["נוגה", "מאדים", "חמה", "צדק"],
            correct: 2
        },
        {
            q: "מהו היסוד הכימי בעל הסמל 'O'?",
            options: ["זהב", "חמצן", "מימן", "כסף"],
            correct: 1
        }
    ];

    let currentQuestionIndex = 0;

    // הפעלת טיימר של 14 שניות
    function startQuestionTimer() {
        clearInterval(timerInterval);
        timeRemaining = QUESTION_INTERVAL;
        updateTimerUI();

        timerInterval = setInterval(() => {
            if (!isPaused) {
                timeRemaining -= 0.1;
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    triggerQuestion();
                }
                updateTimerUI();
            }
        }, 100);
    }

    function updateTimerUI() {
        document.getElementById('time-text').innerText = Math.ceil(timeRemaining);
        const percentage = (timeRemaining / QUESTION_INTERVAL) * 100;
        document.getElementById('timer-bar').style.width = percentage + '%';
    }

    // עצירת המשחק והצגת השאלה
    function triggerQuestion() {
        isPaused = true; // עצירת המשחק
        const modal = document.getElementById('questionModal');
        const qText = document.getElementById('questionText');
        const optsContainer = document.getElementById('optionsContainer');
        const feedback = document.getElementById('feedbackText');

        feedback.innerText = '';
        
        const currentQ = questions[currentQuestionIndex];
        qText.innerText = currentQ.q;
        optsContainer.innerHTML = '';

        currentQ.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(idx);
            optsContainer.appendChild(btn);
        });

        modal.classList.add('active');
    }

    // בדיקת תשובה
    function handleAnswer(selectedIndex) {
        const currentQ = questions[currentQuestionIndex];
        const feedback = document.getElementById('feedbackText');

        if (selectedIndex === currentQ.correct) {
            feedback.className = 'feedback-message feedback-correct';
            feedback.innerText = 'תשובה נכונה! המשחק ממשיך...';
            score += 10;
            document.getElementById('score').innerText = score;

            // מעבר לשאלה הבאה
            currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;

            // סגירת החלונית והמשך המשחק
            setTimeout(() => {
                document.getElementById('questionModal').classList.remove('active');
                isPaused = false; // המשך המשחק
                startQuestionTimer(); // איפוס הטיימר ל-14 שניות
            }, 800);
        } else {
            feedback.className = 'feedback-message feedback-wrong';
            feedback.innerText = 'תשובה שגויה! נסה שוב...';
        }
    }

    // לולאת המשחק הראשית (Game Loop)
    function updateGame() {
        if (!isPaused) {
            // עדכון מיקום השחקן
            player.x += player.speedX;
            player.y += player.speedY;

            // הדהוד מקירות
            if (player.x + player.radius > canvas.width || player.x - player.radius < 0) {
                player.speedX *= -1;
            }
            if (player.y + player.radius > canvas.height || player.y - player.radius < 0) {
                player.speedY *= -1;
            }
        }

        // ציור הפריים
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ציור השחקן
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = player.color;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        requestAnimationFrame(updateGame);
    }

    // התחלת המשחק
    startQuestionTimer();
    updateGame();
</script>

</body>
</html>
